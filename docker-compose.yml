services:
  lovable-mcp-proxy:
    build: .
    container_name: lovable-mcp-proxy
    restart: unless-stopped
    ports:
      # Permite amarrar ao IP específico da VPN (ex: 10.8.0.5:8000:8000) via .env
      - "${BIND_IP:-0.0.0.0}:${PORT:-8000}:8000"
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-minha_chave_secreta_123}
      - TOKEN_FILE_PATH=/app/data/tokens.json
      - DATA_DIR=/app/data
      - LOVABLE_MCP_URL=${LOVABLE_MCP_URL:-https://mcp.lovable.dev}
      - USCREEN_MCP_URL=${USCREEN_MCP_URL:-https://app.uscreen.tv/mcp}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - META_APP_ID=${META_APP_ID:-}
      - META_APP_SECRET=${META_APP_SECRET:-}
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN:-meta_mcp_hub_token}
      - META_AGENT_TRIGGER_URL=${META_AGENT_TRIGGER_URL:-}
      - YUNGAS_CLIENT_ID=${YUNGAS_CLIENT_ID:-}
      - YUNGAS_CLIENT_SECRET=${YUNGAS_CLIENT_SECRET:-}
      - YUNGAS_SCOPES=${YUNGAS_SCOPES:-}
      - YUNGAS_ENV=${YUNGAS_ENV:-production}
      - YUNGAS_PEX_API_KEY=${YUNGAS_PEX_API_KEY:-}
      - SULTS_TOKEN_V1=${SULTS_TOKEN_V1:-}
      - SULTS_TOKEN_V2=${SULTS_TOKEN_V2:-}
      - OMIE_APP_KEY=${OMIE_APP_KEY:-}
      - OMIE_APP_SECRET=${OMIE_APP_SECRET:-}
      - RDSTATION_CLIENT_ID=${RDSTATION_CLIENT_ID:-}
      - RDSTATION_CLIENT_SECRET=${RDSTATION_CLIENT_SECRET:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
